<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Learn about a Wellness Oasis Clinic service and book your visit.">
    <title>Service | Wellness Oasis Clinic</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
    <script src="ui.js" defer></script>
    <script src="app.js" defer></script>
    <script src="servicedetails.js" defer></script>
  </head>
  <body>
    <div data-site-header></div>
    <main>
      <section id="service-detail" class="container detail-grid">
        <div class="loading-state">Loading service…</div>
      </section>
      <section id="service-doctors-section" class="section" hidden>
        <div class="container">
          <div class="section-heading">
            <div>
              <span class="eyebrow">Specialists</span>
              <h2>Doctors for this service</h2>
            </div>
          </div>
          <div id="service-doctors" class="card-grid"></div>
        </div>
      </section>
      <section class="section section-white">
        <div class="container cta">
          <div class="cta-grid">
            <div>
              <h2>Ready to take the next step?</h2>
              <p>Choose a doctor and reserve a visit, or ask the care desk anything first.</p>
            </div>
            <a class="button button-secondary" href="contactus.html">Ask the care desk</a>
          </div>
        </div>
      </section>
    </main>
    <div data-site-footer></div>
  </body>
</html>
