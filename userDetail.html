<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Manage your Wellness Oasis profile and appointments.">
    <title>My patient portal | Wellness Oasis Clinic</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
    <script src="ui.js" defer></script>
    <script src="userinfo.js" defer></script>
  </head>
  <body>
    <div data-site-header></div>
    <main class="container portal-layout">
      <aside id="profile-card" class="panel profile-panel">
        <div class="loading-state">Loading profile…</div>
      </aside>
      <section class="portal-main">
        <div class="portal-header">
          <div>
            <span class="eyebrow">Patient portal</span>
            <h1>Hello, <span id="welcome-name">there</span></h1>
            <p>Manage your upcoming visits and personal details.</p>
          </div>
          <a class="button button-primary" href="index.html#doctors">Book appointment</a>
        </div>
        <div class="stats">
          <div class="panel stat"><strong id="stat-upcoming">—</strong><span>Upcoming visits</span></div>
          <div class="panel stat"><strong id="stat-completed">—</strong><span>Completed visits</span></div>
          <div class="panel stat"><strong id="stat-total">—</strong><span>Total appointments</span></div>
        </div>
        <div class="panel appointments-panel">
          <div class="panel-title">
            <h2>Your appointments</h2>
          </div>
          <div id="appointment-list" class="appointment-list">
            <div class="loading-state">Loading appointments…</div>
          </div>
        </div>
      </section>
    </main>

    <div id="profile-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="profile-title">
      <div class="modal-card">
        <div class="modal-head">
          <h2 id="profile-title">Update profile</h2>
          <button class="icon-button" data-close-profile type="button" aria-label="Close">×</button>
        </div>
        <form id="profile-form" class="form-grid" onsubmit="updateProfile(event)">
          <div class="form-row">
            <div class="field">
              <label for="profile-first-name">First name</label>
              <input id="profile-first-name" name="first_name" required>
            </div>
            <div class="field">
              <label for="profile-last-name">Last name</label>
              <input id="profile-last-name" name="last_name" required>
            </div>
          </div>
          <div class="field">
            <label for="profile-email">Email</label>
            <input id="profile-email" name="email" type="email" required>
          </div>
          <div class="field">
            <label for="profile-mobile">Mobile number</label>
            <input id="profile-mobile" name="mobile_no" type="tel">
          </div>
          <div data-form-message class="form-message" hidden role="alert"></div>
          <button class="button button-primary" type="submit">Save changes</button>
        </form>
      </div>
    </div>
    <div data-site-footer></div>
  </body>
</html>
