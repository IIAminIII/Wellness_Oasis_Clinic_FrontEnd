<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="View a Wellness Oasis doctor profile and book an appointment.">
    <title>Doctor profile | Wellness Oasis Clinic</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
    <script src="ui.js" defer></script>
    <script src="docdetails.js" defer></script>
  </head>
  <body>
    <div data-site-header></div>
    <main>
      <section id="doctor-detail" class="container detail-grid">
        <div class="loading-state">Loading doctor profile…</div>
      </section>
    </main>

    <div id="booking-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="booking-title">
      <div class="modal-card">
        <div class="modal-head">
          <div>
            <span class="eyebrow">Reserve your visit</span>
            <h2 id="booking-title">Book appointment</h2>
          </div>
          <button class="icon-button" data-close-booking type="button" aria-label="Close">×</button>
        </div>
        <form class="form-grid" onsubmit="handleAppointment(event)">
          <div class="form-row">
            <div class="field">
              <label for="appointment-type">Visit type</label>
              <select id="appointment-type" name="appointment_type" required>
                <option value="Offline">In person</option>
                <option value="Online">Online</option>
              </select>
            </div>
            <div class="field">
              <label for="appointment-date">Date</label>
              <input id="appointment-date" name="scheduled_date" type="date" required>
            </div>
          </div>
          <div class="field">
            <label for="appointment-time">Available time</label>
            <select id="appointment-time" name="time" required>
              <option value="">Choose an available time</option>
            </select>
          </div>
          <div class="field">
            <label for="symptoms">How can the doctor help?</label>
            <textarea id="symptoms" name="symptoms" maxlength="2000" placeholder="Briefly describe symptoms or the reason for your visit" required></textarea>
          </div>
          <div data-form-message class="form-message" hidden role="alert"></div>
          <button class="button button-primary button-block" type="submit">Confirm appointment</button>
        </form>
      </div>
    </div>
    <div data-site-footer></div>
  </body>
</html>
