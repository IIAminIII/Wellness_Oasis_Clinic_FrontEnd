<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Secure patient sign in for Wellness Oasis Clinic.">
    <title>Sign in | Wellness Oasis Clinic</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
    <script src="ui.js" defer></script>
    <script src="authentication.js" defer></script>
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-panel">
        <div class="auth-card">
          <a class="brand" href="index.html">
            <span class="brand-mark"><img src="assets/mainlogo.svg" alt=""></span>
            <span>Wellness <strong>Oasis</strong></span>
          </a>
          <span class="eyebrow">Patient portal</span>
          <h1>Welcome back</h1>
          <p>Sign in to manage your profile and appointments.</p>
          <form class="form-grid" onsubmit="handleLogin(event)" data-auth-form>
            <div class="field">
              <label for="identifier">Username or email</label>
              <input id="identifier" name="identifier" type="text" autocomplete="username" required>
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <div data-form-message class="form-message" hidden role="alert"></div>
            <button class="button button-primary button-block" type="submit">Sign in securely</button>
          </form>
          <p class="form-footer">New to Wellness Oasis? <a href="signup.html">Create an account</a></p>
        </div>
      </section>
      <aside class="auth-visual" aria-hidden="true">
        <img src="assets/login.png" alt="">
        <div class="auth-quote">“A calmer way to keep your healthcare organised—from booking through follow-up.”</div>
      </aside>
    </main>
  </body>
</html>
